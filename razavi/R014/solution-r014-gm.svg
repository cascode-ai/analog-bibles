<title>R014 · Intrinsic transconductance</title>
<desc>Long-channel square law with body effect and λ = 0. Gray marks where ideal current balance requires negative source voltage. A junction model and current-sink compliance data are needed there.</desc>
<rect width="880" height="748" fill="#ffffff"/>
<text x="32" y="41" font-size="23" font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="start" fill="#183048">R014 · Intrinsic transconductance</text>
<text x="32" y="69" font-size="15" font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="start" fill="#183048">Long-channel square law with body effect and λ = 0.</text>
<text x="32" y="98" font-size="16" font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="start" fill="#183048">Cutoff example    I₁ = 0.1 mA, R₁ = 9 kΩ, β = 2 mA/V²</text>
<text x="32" y="125" font-size="15" font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="start" fill="#183048">V_S = 0 at 0.8035 V. Cutoff occurs at V_X = 1.9408 V.</text>
