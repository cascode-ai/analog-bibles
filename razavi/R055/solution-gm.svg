    <path d="M 342 190.5714 H 444" fill="none" stroke="#1a58a3" stroke-width="2.8"/>
    <circle cx="342" cy="261.7143" r="4.6" fill="#fff" stroke="#1a58a3" stroke-width="2"/>
    <circle cx="342" cy="190.5714" r="4.6" fill="#fff" stroke="#1a58a3" stroke-width="2"/>
    <text x="274" y="380" font-size="17" text-anchor="middle">V_X (V)</text>
    <text x="35" y="238" font-size="17" text-anchor="middle" transform="rotate(-90 35 238)">g_m,eq (mS)</text>
