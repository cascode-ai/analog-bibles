<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780">
  <title>Equivalent transconductance vs. V_X</title>
  <desc>Four gate-voltage examples share the same axis scales. Open circles mark the one-sided limits at each transition, where transconductance is undefined.</desc>
  <rect x="0" y="0" width="1000" height="780" fill="#fff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132239">
    <text x="44" y="42" font-size="25" text-anchor="start" font-weight="bold">Equivalent transconductance vs. V_X</text>
    <text x="44" y="72" font-size="16" text-anchor="start">Example parameters βₙ = βₚ = 1 mA/V², λ = γ = 0</text>
    <text x="104" y="113" font-size="20" text-anchor="start" font-weight="bold">V_G = 1.0 V</text>
    <text x="104" y="138" font-size="14" text-anchor="start">Turn-on 1.8 V / Transition 2.1 V</text>
    <rect x="104" y="155" width="340" height="166" fill="#fafbfd"/>
    <text x="88" y="326" font-size="14" text-anchor="end">−0.8</text>
    <path d="M 104 273.5714 H 444" fill="none" stroke="#d8e1ec" stroke-width="1"/>
    <text x="88" y="278.5714" font-size="14" text-anchor="end">−0.4</text>
    <path d="M 104 226.1429 H 444" fill="none" stroke="#a7b4c4" stroke-width="1"/>
    <text x="88" y="231.1429" font-size="14" text-anchor="end">0</text>
