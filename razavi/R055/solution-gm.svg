    <text x="774" y="682" font-size="17" text-anchor="middle">V_X (V)</text>
    <text x="535" y="540" font-size="17" text-anchor="middle" transform="rotate(-90 535 540)">g_m,eq (mS)</text>
    <text x="44" y="725" font-size="15" text-anchor="start">Zero → PMOS-limited (negative ramp) → NMOS-limited (positive plateau, when visible)</text>
    <text x="44" y="749" font-size="15" text-anchor="start">Open circles show the one-sided limits. The derivative is undefined at the transition.</text>
