<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780">
  <title>Series MOS current vs. V_X</title>
  <desc>Four gate-voltage examples share the same axis scales. Current starts at zero, rises parabolically and reaches a plateau if the transition is in range.</desc>
  <rect x="0" y="0" width="1000" height="780" fill="#fff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132239">
    <text x="44" y="42" font-size="25" text-anchor="start" font-weight="bold">Series MOS current vs. V_X</text>
    <text x="44" y="72" font-size="16" text-anchor="start">Example parameters βₙ = βₚ = 1 mA/V², λ = γ = 0</text>
    <text x="104" y="113" font-size="20" text-anchor="start" font-weight="bold">V_G = 1.0 V</text>
    <text x="104" y="138" font-size="14" text-anchor="start">Turn-on 1.8 V / Transition 2.1 V</text>
    <rect x="104" y="155" width="340" height="166" fill="#fafbfd"/>
    <path d="M 104 302.5556 H 444" fill="none" stroke="#a7b4c4" stroke-width="1"/>
    <text x="88" y="307.5556" font-size="14" text-anchor="end">0</text>
    <path d="M 104 249.8571 H 444" fill="none" stroke="#d8e1ec" stroke-width="1"/>
    <text x="88" y="254.8571" font-size="14" text-anchor="end">0.1</text>
    <path d="M 104 197.1587 H 444" fill="none" stroke="#d8e1ec" stroke-width="1"/>
    <text x="88" y="202.1587" font-size="14" text-anchor="end">0.2</text>
    <text x="104" y="349" font-size="14" text-anchor="middle">0</text>
    <path d="M 217.3333 155 V 321" fill="none" stroke="#e4eaf1" stroke-width="1"/>
    <text x="217.3333" y="349" font-size="14" text-anchor="middle">1</text>
    <path d="M 330.6667 155 V 321" fill="none" stroke="#e4eaf1" stroke-width="1"/>
    <text x="330.6667" y="349" font-size="14" text-anchor="middle">2</text>
    <text x="444" y="349" font-size="14" text-anchor="middle">3</text>
    <line x1="104" y1="155" x2="104" y2="321" stroke="#26364a" stroke-width="1.6"/>
    <line x1="104" y1="321" x2="444" y2="321" stroke="#26364a" stroke-width="1.6"/>
    <path d="M 308 155 V 321" fill="none" stroke="#bac7d7" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 342 155 V 321" fill="none" stroke="#bac7d7" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 104 302.5556 H 308 Q 325 302.5556 342 278.8413 H 444" fill="none" stroke="#1a58a3" stroke-width="2.8" stroke-linejoin="round"/>
    <circle cx="308" cy="302.5556" r="3.7" fill="#1a58a3" stroke="#1a58a3" stroke-width="1"/>
    <circle cx="342" cy="278.8413" r="3.7" fill="#1a58a3" stroke="#1a58a3" stroke-width="1"/>
    <text x="274" y="380" font-size="17" text-anchor="middle">V_X (V)</text>
    <text x="35" y="238" font-size="17" text-anchor="middle" transform="rotate(-90 35 238)">I_X (mA)</text>
    <text x="604" y="113" font-size="20" text-anchor="start" font-weight="bold">V_G = 1.2 V</text>
    <text x="604" y="138" font-size="14" text-anchor="start">Turn-on 2.0 V / Transition 2.5 V</text>
    <rect x="604" y="155" width="340" height="166" fill="#fafbfd"/>
    <path d="M 604 302.5556 H 944" fill="none" stroke="#a7b4c4" stroke-width="1"/>
    <text x="588" y="307.5556" font-size="14" text-anchor="end">0</text>
    <path d="M 604 249.8571 H 944" fill="none" stroke="#d8e1ec" stroke-width="1"/>
    <text x="588" y="254.8571" font-size="14" text-anchor="end">0.1</text>
    <path d="M 604 197.1587 H 944" fill="none" stroke="#d8e1ec" stroke-width="1"/>
    <text x="588" y="202.1587" font-size="14" text-anchor="end">0.2</text>
    <text x="604" y="349" font-size="14" text-anchor="middle">0</text>
    <path d="M 717.3333 155 V 321" fill="none" stroke="#e4eaf1" stroke-width="1"/>
    <text x="717.3333" y="349" font-size="14" text-anchor="middle">1</text>
    <path d="M 830.6667 155 V 321" fill="none" stroke="#e4eaf1" stroke-width="1"/>
    <text x="830.6667" y="349" font-size="14" text-anchor="middle">2</text>
    <text x="944" y="349" font-size="14" text-anchor="middle">3</text>
    <line x1="604" y1="155" x2="604" y2="321" stroke="#26364a" stroke-width="1.6"/>
    <line x1="604" y1="321" x2="944" y2="321" stroke="#26364a" stroke-width="1.6"/>
    <path d="M 830.6667 155 V 321" fill="none" stroke="#bac7d7" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 887.3333 155 V 321" fill="none" stroke="#bac7d7" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 604 302.5556 H 830.6667 Q 859 302.5556 887.3333 236.6825 H 944" fill="none" stroke="#a23c30" stroke-width="2.8" stroke-linejoin="round"/>
    <circle cx="830.6667" cy="302.5556" r="3.7" fill="#a23c30" stroke="#a23c30" stroke-width="1"/>
    <circle cx="887.3333" cy="236.6825" r="3.7" fill="#a23c30" stroke="#a23c30" stroke-width="1"/>
    <text x="774" y="380" font-size="17" text-anchor="middle">V_X (V)</text>
    <text x="535" y="238" font-size="17" text-anchor="middle" transform="rotate(-90 535 238)">I_X (mA)</text>
    <text x="104" y="415" font-size="20" text-anchor="start" font-weight="bold">V_G = 1.5 V</text>
    <text x="104" y="440" font-size="14" text-anchor="start">Turn-on 2.3 V / Transition 3.1 V (out of range)</text>
    <rect x="104" y="457" width="340" height="166" fill="#fafbfd"/>
    <path d="M 104 604.5556 H 444" fill="none" stroke="#a7b4c4" stroke-width="1"/>
    <text x="88" y="609.5556" font-size="14" text-anchor="end">0</text>
    <path d="M 104 551.8571 H 444" fill="none" stroke="#d8e1ec" stroke-width="1"/>
    <text x="88" y="556.8571" font-size="14" text-anchor="end">0.1</text>
    <path d="M 104 499.1587 H 444" fill="none" stroke="#d8e1ec" stroke-width="1"/>
    <text x="88" y="504.1587" font-size="14" text-anchor="end">0.2</text>
    <text x="104" y="651" font-size="14" text-anchor="middle">0</text>
    <path d="M 217.3333 457 V 623" fill="none" stroke="#e4eaf1" stroke-width="1"/>
    <text x="217.3333" y="651" font-size="14" text-anchor="middle">1</text>
    <path d="M 330.6667 457 V 623" fill="none" stroke="#e4eaf1" stroke-width="1"/>
    <text x="330.6667" y="651" font-size="14" text-anchor="middle">2</text>
    <text x="444" y="651" font-size="14" text-anchor="middle">3</text>
    <line x1="104" y1="457" x2="104" y2="623" stroke="#26364a" stroke-width="1.6"/>
    <line x1="104" y1="623" x2="444" y2="623" stroke="#26364a" stroke-width="1.6"/>
    <path d="M 364.6667 457 V 623" fill="none" stroke="#bac7d7" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 104 604.5556 H 364.6667 Q 404.3333 604.5556 444 475.4444" fill="none" stroke="#13735e" stroke-width="2.8" stroke-linejoin="round"/>
    <circle cx="364.6667" cy="604.5556" r="3.7" fill="#13735e" stroke="#13735e" stroke-width="1"/>
    <text x="274" y="682" font-size="17" text-anchor="middle">V_X (V)</text>
    <text x="35" y="540" font-size="17" text-anchor="middle" transform="rotate(-90 35 540)">I_X (mA)</text>
    <text x="604" y="415" font-size="20" text-anchor="start" font-weight="bold">V_G = 2.0 V</text>
    <text x="604" y="440" font-size="14" text-anchor="start">Turn-on 2.8 V / Transition 4.1 V (out of range)</text>
    <rect x="604" y="457" width="340" height="166" fill="#fafbfd"/>
    <path d="M 604 604.5556 H 944" fill="none" stroke="#a7b4c4" stroke-width="1"/>
    <text x="588" y="609.5556" font-size="14" text-anchor="end">0</text>
    <path d="M 604 551.8571 H 944" fill="none" stroke="#d8e1ec" stroke-width="1"/>
    <text x="588" y="556.8571" font-size="14" text-anchor="end">0.1</text>
    <path d="M 604 499.1587 H 944" fill="none" stroke="#d8e1ec" stroke-width="1"/>
    <text x="588" y="504.1587" font-size="14" text-anchor="end">0.2</text>
    <text x="604" y="651" font-size="14" text-anchor="middle">0</text>
    <path d="M 717.3333 457 V 623" fill="none" stroke="#e4eaf1" stroke-width="1"/>
    <text x="717.3333" y="651" font-size="14" text-anchor="middle">1</text>
    <path d="M 830.6667 457 V 623" fill="none" stroke="#e4eaf1" stroke-width="1"/>
    <text x="830.6667" y="651" font-size="14" text-anchor="middle">2</text>
    <text x="944" y="651" font-size="14" text-anchor="middle">3</text>
    <line x1="604" y1="457" x2="604" y2="623" stroke="#26364a" stroke-width="1.6"/>
    <line x1="604" y1="623" x2="944" y2="623" stroke="#26364a" stroke-width="1.6"/>
    <path d="M 921.3333 457 V 623" fill="none" stroke="#bac7d7" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 604 604.5556 H 921.3333 Q 932.6667 604.5556 944 594.0159" fill="none" stroke="#704496" stroke-width="2.8" stroke-linejoin="round"/>
    <circle cx="921.3333" cy="604.5556" r="3.7" fill="#704496" stroke="#704496" stroke-width="1"/>
    <text x="774" y="682" font-size="17" text-anchor="middle">V_X (V)</text>
    <text x="535" y="540" font-size="17" text-anchor="middle" transform="rotate(-90 535 540)">I_X (mA)</text>
    <text x="44" y="725" font-size="15" text-anchor="start">Zero current → PMOS-limited (parabola) → NMOS-limited (plateau, when visible)</text>
  </g>
</svg>
