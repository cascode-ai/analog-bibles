<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 780 468" role="img" aria-labelledby="title desc">
<title id="title">Equivalent transconductance vs. node voltage</title><desc id="desc">Four curves for gate voltages of 0.5, 1.0, 1.5 and 2.0 V. The NMOS triode-to-saturation boundary is Vɢ − 0.7 V, and the PMOS turns on at Vɢ + 0.8 V.</desc>
