<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480">
  <title>R057 正阶跃下的 V_Y 波形</title>
  <desc>示例参数 V_DD=3 V、V_TH=0.7 V、V_0=1 V、V_ov=0.447 V，以 τ 为时间单位。t=0 时 V_Y 从 1.853 V 跳到 2.853 V，随后按双曲线趋近 2.553 V。</desc>
  <rect x="0" y="0" width="760" height="480" fill="white"/>
  <line x1="90" y1="375" x2="700" y2="375" stroke="black" stroke-width="2"/>
  <line x1="90" y1="55" x2="90" y2="375" stroke="black" stroke-width="2"/>
  <line x1="90" y1="295" x2="700" y2="295" stroke="#d0d0d0" stroke-width="1"/>
  <line x1="90" y1="215" x2="700" y2="215" stroke="#d0d0d0" stroke-width="1"/>
  <line x1="90" y1="135" x2="700" y2="135" stroke="#d0d0d0" stroke-width="1"/>
  <line x1="145" y1="375" x2="145" y2="55" stroke="#808080" stroke-width="1" stroke-dasharray="5 5"/>
  <polyline points="90,319 145,319 145,159 200,183 255,191 365,199 585,204 700,205" fill="none" stroke="#b23a48" stroke-width="3"/>
  <circle cx="145" cy="159" r="4" fill="#b23a48"/>
  <circle cx="200" cy="183" r="4" fill="#b23a48"/>
  <circle cx="700" cy="205" r="4" fill="#b23a48"/>
  <text x="78" y="380" text-anchor="end" font-size="16">1.5</text>
  <text x="78" y="300" text-anchor="end" font-size="16">2.0</text>
  <text x="78" y="220" text-anchor="end" font-size="16">2.5</text>
  <text x="78" y="140" text-anchor="end" font-size="16">3.0</text>
  <text x="90" y="405" text-anchor="middle" font-size="16">−1</text>
  <text x="145" y="405" text-anchor="middle" font-size="16">0</text>
  <text x="200" y="405" text-anchor="middle" font-size="16">1</text>
  <text x="365" y="405" text-anchor="middle" font-size="16">4</text>
  <text x="585" y="405" text-anchor="middle" font-size="16">8</text>
  <text x="700" y="405" text-anchor="middle" font-size="16">10</text>
  <text x="395" y="450" text-anchor="middle" font-size="18">t / τ</text>
  <text x="25" y="215" text-anchor="middle" font-size="18" transform="rotate(-90 25 215)">V_Y（V）</text>
  <text x="350" y="100" font-size="16" fill="#b23a48">V_Y(0⁺)=2.853 V</text>
  <text x="475" y="195" font-size="16" fill="#b23a48">V_Y(∞)=2.553 V</text>
</svg>
