<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">Small-signal circuit for the transit-frequency test</title>
<desc id="desc">Input current enters gate G. The gate-source capacitor returns to AC ground and the gate-drain capacitor connects G to D. Drain D is shorted to AC ground, with output current defined toward D. The controlled current source points from D toward the source.</desc>
<rect width="760" height="390" fill="#fff"/>
<g fill="#20333f" font-family="Arial, Microsoft YaHei, sans-serif">
<text x="36" y="41" font-size="22">Small-signal circuit for the transit-frequency test</text>
<text x="36" y="69" font-size="15">Source and bulk at AC ground. The drain is AC-shorted.</text>
</g>
