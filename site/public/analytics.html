<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Analytics — Analog Bibles</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<script>
  // Follow the main reader's choice; keep the legacy analytics key as a
  // fallback for returning dashboard users.
  try {
    const theme = localStorage.getItem("ab.theme") || localStorage.getItem("ab.analyticsTheme");
    const light = theme === "light" || (theme !== "dark" && !matchMedia("(prefers-color-scheme: dark)").matches);
    if (light) document.documentElement.classList.add("light");
  } catch {}
</script>
<link rel="stylesheet" href="/analytics.css">
</head>
<body class="analytics-body">
<div id="root"><div class="analytics-loading">Loading analytics…</div></div>
<script src="/analytics-page.js"></script>
</body>
</html>
