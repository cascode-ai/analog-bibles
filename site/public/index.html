<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analog Bibles · Review</title>
<meta name="description" content="Razavi、Gray、Allen 三本模拟集成电路教材习题：题目、题图、参考答案，在线报错与评论。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="/style.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="/app.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/review?scope=random">Analog Bibles</a>
  <span class="sub">Razavi · Gray · Allen 习题审阅</span>
  <a class="gh" href="https://github.com/cascode-ai/analog-bibles" target="_blank" rel="noopener">GitHub ↗</a>
</header>
<div class="layout">
  <aside class="side" id="side">
    <input id="search" class="search" type="search" placeholder="搜索题号或题目文字（/）" autocomplete="off">
    <div class="group-title">教材</div>
    <div class="list" id="scopes"></div>
    <div class="group-title">难度</div>
    <div class="list" id="levels"></div>
    <div class="group-title">状态</div>
    <div class="list" id="statuses"></div>
    <div class="group-title">署名</div>
    <input id="author" class="search" type="text" maxlength="40" placeholder="你的名字（可选）">
    <p class="hint">快捷键：← → 翻题 · R 随机 · P 通过 · 1–6 选报错原因 · Enter 提交</p>
  </aside>
  <main class="main">
    <div class="toolbar">
      <div class="progress" id="progress"></div>
      <span class="steps">
        <button type="button" id="prev" title="上一题 (←)" aria-label="上一题">←</button>
        <span class="position" id="position">– / –</span>
        <button type="button" id="next" title="下一题 (→)" aria-label="下一题">→</button>
        <button type="button" id="random" title="随机一道你还没看过的题 (R)">随机 <kbd>R</kbd></button>
      </span>
    </div>
    <article class="item" id="item"><p class="empty">加载中…</p></article>
  </main>
</div>
<div class="zoom" id="zoom" hidden><img alt=""></div>
</body>
</html>
