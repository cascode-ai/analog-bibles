<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analog Bibles</title>
<meta name="description" content="End-of-chapter problems from Razavi, Gray and Allen: the question, its figures and a reference answer.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="/style.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="/app.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Analog Bibles</a>
  <span class="sub" data-i18n="sub">Razavi · Gray · Allen textbook problems</span>
  <nav class="modes" data-i18n-aria="modes" aria-label="Mode">
    <a id="mode-browse" href="/browse" data-i18n="browse">Browse</a>
    <a id="mode-review" href="/review" data-i18n="review" data-i18n-title="reviewTitle" title="For maintainers: pass, report issues, comment">Review</a>
  </nav>
  <a class="gh" href="https://github.com/cascode-ai/analog-bibles" target="_blank" rel="noopener">GitHub ↗</a>
  <!-- Languages icon (A / 文), as on tokenzhang.com -->
  <button type="button" class="lang-switch" id="lang-switch" aria-label="切换到中文" title="切换到中文">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg>
  </button>
</header>
<div class="layout">
  <div class="sidebar-shell">
    <button type="button" id="sidebar-toggle" aria-controls="side" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
    </button>
  <aside class="side" id="side">
    <input id="search" class="search" type="search" data-i18n-ph="search" placeholder="Search ID or question text (/)" autocomplete="off">
    <div class="group-title" data-i18n="book">Book</div>
    <div class="list" id="scopes"></div>
    <div class="group-title" data-i18n="difficulty">Difficulty</div>
    <div class="list" id="levels"></div>
    <div class="review-only">
      <div class="group-title" data-i18n="status">Status</div>
      <div class="list" id="statuses"></div>
      <div class="group-title" data-i18n="name">Name</div>
      <input id="author" class="search" type="text" maxlength="40" data-i18n-ph="namePh" placeholder="Your name (optional)">
    </div>
    <p class="hint review-only" data-i18n="hintReview">Keys: ← → step · R random · P pass · 1–6 pick a reason · Enter submit</p>
    <p class="hint browse-only" data-i18n="hintBrowse">Keys: ← → step · R random · / search</p>
  </aside>
  </div>
  <main class="main">
    <div class="toolbar">
      <div class="progress review-only" id="progress"></div>
      <button type="button" id="reading-view" class="btn browse-only" aria-pressed="false">Focus reading</button>
      <span class="steps">
        <button type="button" id="prev-ch" data-i18n-title="prevCh" data-i18n-aria="prevCh" title="Previous chapter (Shift+←)" aria-label="Previous chapter">«</button>
        <button type="button" id="prev" data-i18n-title="prev" data-i18n-aria="prev" title="Previous (←)" aria-label="Previous">‹</button>
        <span class="position">
          <input id="goto" type="text" inputmode="numeric" autocomplete="off" data-i18n-title="gotoTitle" data-i18n-aria="gotoTitle" title="Type a number and press Enter" aria-label="Question number">
          <span id="total">/ –</span>
        </span>
        <button type="button" id="next" data-i18n-title="next" data-i18n-aria="next" title="Next (→)" aria-label="Next">›</button>
        <button type="button" id="next-ch" data-i18n-title="nextCh" data-i18n-aria="nextCh" title="Next chapter (Shift+→)" aria-label="Next chapter">»</button>
        <span class="chapter" id="chapter"></span>
        <button type="button" id="random" data-i18n-title="randomTitle" title="A random question (R)"><span data-i18n="random">Random</span> <kbd>R</kbd></button>
      </span>
    </div>
    <article class="item" id="item"><p class="empty" data-i18n="loading">Loading…</p></article>
  </main>
</div>
<div class="zoom" id="zoom" hidden><img alt=""></div>
</body>
</html>
